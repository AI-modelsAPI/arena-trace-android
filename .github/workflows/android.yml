name: Android Build

on:
  push:
    # arena/** = agent work branches: each push is built and tested, and the
    # APKs are available as run artifacts before anything reaches main.
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned image: ubuntu-latest moves to a new Ubuntu release in Oct 2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # No gradle wrapper is committed; install Gradle explicitly (AGP 8.5
      # requires Gradle 8.7+). Caches are handled by setup-gradle.
      # v5 = Node 24 runtime, MIT-licensed (v6 moved caching to a proprietary component).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      # Output is also written to $RUNNER_TEMP/*.log so a failure can be surfaced
      # as check-run annotations (readable without downloading the raw logs).
      - name: Run JVM unit tests
        shell: bash
        run: gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/assemble-debug.log"

      - name: Decode release keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "${{ secrets.ARENA_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/arena-release.keystore"

      # Signed with the long-lived keystore from Secrets, so every CI build can
      # be installed as an in-place upgrade over previous CI builds.
      - name: Build signed release APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          ARENA_KEYSTORE: ${{ runner.temp }}/arena-release.keystore
          ARENA_KEYSTORE_PASSWORD: ${{ secrets.ARENA_KEYSTORE_PASSWORD }}
          ARENA_KEY_ALIAS: ${{ secrets.ARENA_KEY_ALIAS }}
          ARENA_KEY_PASSWORD: ${{ secrets.ARENA_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/assemble-release.log"

      # Versioned file names; uploaded as plain .apk files (archive: false), so the
      # artifact downloads straight to an installable APK instead of a zip.
      - name: Name APKs
        shell: bash
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          [ -n "$version" ] || { echo "::error::versionName not found in app/build.gradle.kts"; exit 1; }
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/arena-trace-v${version}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/arena-trace-v${version}-release.apk"
          fi
          echo "APK_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Upload signed release APK
        id: upload_release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          path: dist/arena-trace-v${{ env.APK_VERSION }}-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload debug APK
        id: upload_debug
        uses: actions/upload-artifact@v7
        with:
          path: dist/arena-trace-v${{ env.APK_VERSION }}-debug.apk
          archive: false
          if-no-files-found: error

      # Direct download links at the top of the run page.
      - name: Summary
        shell: bash
        env:
          RELEASE_URL: ${{ steps.upload_release.outputs.artifact-url }}
          DEBUG_URL: ${{ steps.upload_debug.outputs.artifact-url }}
        run: |
          {
            echo "### Arena Trace v${APK_VERSION}"
            if [ -n "$RELEASE_URL" ]; then
              echo "- 正式签名版（推荐，可覆盖升级）：[arena-trace-v${APK_VERSION}-release.apk](${RELEASE_URL})"
            fi
            echo "- 调试版：[arena-trace-v${APK_VERSION}-debug.apk](${DEBUG_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      # Compiler errors, Gradle failure summaries and failed unit tests become
      # ::error annotations on the check run.
      - name: Annotate failures
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re
          import xml.etree.ElementTree as ET

          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')

          def emit(title, lines):
              for i in range(0, min(len(lines), 160), 40):
                  print(f"::error title={title}::" + esc("\n".join(lines[i:i + 40])))

          tmp = os.environ.get('RUNNER_TEMP', '.')
          for path in sorted(glob.glob(os.path.join(tmp, '*.log'))):
              lines = open(path, errors='replace').read().splitlines()
              hits, grab = [], False
              for line in lines:
                  if line.startswith('* What went wrong'):
                      grab = True
                  elif grab and (line.startswith('* Try') or line.startswith('* Exception')):
                      grab = False
                  if grab or re.match(r'^(e: |ERROR:|FAILURE:)', line) or ' error: ' in line:
                      hits.append(line[:500])
              if hits:
                  emit(os.path.basename(path), hits)

          failed = []
          for path in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for tag in ('failure', 'error'):
                      el = case.find(tag)
                      if el is not None:
                          msg = (el.get('message') or (el.text or '').strip().splitlines()[0:1] or [''])
                          msg = msg if isinstance(msg, str) else msg[0]
                          failed.append(f"{case.get('classname')}.{case.get('name')}: {msg[:400]}")
          if failed:
              emit(f"{len(failed)} unit test(s) failed", failed)
          PY
